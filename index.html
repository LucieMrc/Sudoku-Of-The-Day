<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Remplacer le src par le chemin de votre image logo -->
    <div id="logo-container">
        <img src="logo1.png" alt="SU DO KU" id="logo-img">
    </div>
    
    <div class="difficulty-selector">
        <button id="btn-facile" onclick="chargerJeu('facile')">facile</button>
        <button id="btn-moyen" onclick="chargerJeu('moyen')">moyen</button>
        <button id="btn-difficile" onclick="chargerJeu('difficile')">difficile</button>
    </div>

    <div class="info-panel">
        <span id="date-text"></span>
        <span id="timer">00:00</span>
        <span id="btn-reset" onclick="clearAll()">reset</span>
    </div>

    <div class="sudoku-board" id="board"></div>

    <!-- Bouton Mode Notes -->
    <button id="btn-notes" class="btn-notes" onclick="toggleNotes()">
        mode notes désactivé
    </button>

    <!-- Pavé numérique -->
    <div class="numpad">
        <button onclick="saisirChiffre(1)">1</button>
        <button onclick="saisirChiffre(2)">2</button>
        <button onclick="saisirChiffre(3)">3</button>
        <button onclick="saisirChiffre(4)">4</button>
        <button onclick="saisirChiffre(5)">5</button>
        <button onclick="saisirChiffre(6)">6</button>
        <button onclick="saisirChiffre(7)">7</button>
        <button onclick="saisirChiffre(8)">8</button>
        <button onclick="saisirChiffre(9)">9</button>
        <button onclick="effacerCase()" class="btn-erase" title="Effacer la case">←</button>
    </div>

    <div id="victory-message"></div>

    <script src="script.js"></script>
</body>
</html>
